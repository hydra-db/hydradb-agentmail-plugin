[project]
name = "hydradb-agentmail-plugin"
version = "0.1.0"
description = "Sync AgentMail inbox email into HydraDB knowledge as app sources."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HydraDB", email = "cloud@hydradb.com" }]
keywords = ["hydradb", "agentmail", "email", "knowledge-graph", "rag", "memory"]
dependencies = ["requests>=2.28"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://hydradb.com"
Repository = "https://github.com/hydra-db/hydradb-agentmail-plugin"

[project.scripts]
agentmail-sync = "agentmail:main"

[tool.setuptools]
py-modules = ["agentmail"]

[tool.setuptools.package-dir]
"" = "sync"
